name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: lexo/package-lock.json
      - name: Install dependencies
        working-directory: lexo
        run: npm ci
      - name: Run ESLint
        working-directory: lexo
        run: npm run lint
      - name: Run frontend tests with coverage
        working-directory: lexo
        run: npm run test:coverage
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./lexo/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip
      - name: Install backend dependencies
        working-directory: lexo-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests with coverage
        working-directory: lexo-backend
        run: pytest tests/ -q --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./lexo-backend/coverage.xml
          flags: backend
          name: backend-coverage
